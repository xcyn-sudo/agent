# ============================================
# Agent-QR CI/CD 流水线
# 触发条件: 推送到 main 分支 / 手动触发
#
# 流程:
#   1. 构建后端 Docker 镜像 → 推送阿里云 ACR
#   2. 构建前端 Docker 镜像 → 推送阿里云 ACR
#   3. SSH 到 ECS → docker compose pull & up -d
#
# 需要的 GitHub Secrets:
#   ACR_REGISTRY    - 阿里云镜像仓库地址
#                     例如: registry.cn-hangzhou.aliyuncs.com/your-namespace
#   ACR_USERNAME    - 阿里云容器镜像服务用户名
#   ACR_PASSWORD    - 阿里云容器镜像服务密码
#   ECS_HOST        - ECS 公网 IP
#   ECS_SSH_KEY     - ECS SSH 私钥
#   ECS_USER        - ECS SSH 用户名 (默认 root)
# ============================================

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # 允许手动触发

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # Job 1: 构建并推送后端镜像
  # ==========================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/agent-qr-backend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/agent-qr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: 构建并推送前端镜像
  # ==========================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-qr-web-frontend
          file: ./agent-qr-web-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ secrets.ACR_REGISTRY }}/agent-qr-frontend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/agent-qr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 3: SSH 到 ECS 并更新服务
  # ==========================================
  deploy:
    name: Deploy to ECS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER || 'root' }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e

            cd /opt/agent-qr || { echo "ERROR: /opt/agent-qr not found"; exit 1; }

            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== Deploying services ==="
            IMAGE_TAG=${{ github.sha }} \
            ACR_REGISTRY=${{ secrets.ACR_REGISTRY }} \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== Checking service status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== Cleaning old images (keep last 3 days) ==="
            docker image prune -a --filter "until=72h" -f

            echo "=== Deploy completed at $(date) ==="
