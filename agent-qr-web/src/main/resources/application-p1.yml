jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours

llm:
  provider: deepseek
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 2048

embedding:
  provider: ${EMBEDDING_PROVIDER:dashscope}   # 默认 DashScope (千问)，本地开发可改为 ollama

# ── DashScope (千问) Embedding 配置 ──
dashscope:
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: text-embedding-v3

# ── Ollama Embedding 配置（本地开发时使用）──
ollama:
  embedding:
    base-url: http://localhost:11434
    model: qwen3-embedding:4b

langchain4j:
  chroma:
    base-url: http://localhost:8000
    collection-name: enterprise_knowledge

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

rag:
  chunk-size: 500
  chunk-overlap: 50
  embedding:
    write-to-chromadb: true  # P1: 关闭 ChromaDB 写入，节省 API 调用
