  <text x="78" y="98" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">五大痛点 · 量化数据揭示效率黑洞</text>
  <!-- Vertical track -->
