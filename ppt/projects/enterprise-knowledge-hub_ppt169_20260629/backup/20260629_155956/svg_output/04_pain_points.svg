  <text x="240" y="563" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#E8ECF0">重复问答</text>
  <text x="360" y="565" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9CA3AF">HR总监第47次回答"年假怎么算"</text>
  <text x="700" y="565" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280">70%问题是重复的</text>
  <!-- Footer -->
  <text x="1200" y="695" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280">数据来源：《软件需求规格说明书 v2.0》第2章</text>
