<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><line x1="0" y1="60" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/><line x1="60" y1="0" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/></pattern>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00C853" stop-opacity="0.15"/><stop offset="100%" stop-color="#00C853" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/><rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="60" y="35" width="4" height="48" rx="2" fill="#1A73E8"/>
  <text x="78" y="60" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#E8ECF0">核心功能全景图</text>
  <text x="78" y="88" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">八大功能模块 · 围绕企业知识中枢协同工作</text>
  <!-- Central hub -->
  <circle cx="640" cy="380" r="80" fill="url(#hubGlow)"/>
  <circle cx="640" cy="380" r="60" fill="#151B28" stroke="#00C853" stroke-width="2"/>
  <text x="640" y="370" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#E8ECF0">企业知识中枢</text>
  <text x="640" y="398" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#00C853">一个框·10秒·精准答案</text>
  <!-- Spokes -->
  <!-- Top: 智能问答 -->
  <line x1="640" y1="300" x2="640" y2="160" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="490" y="100" width="300" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="640" y="125" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">智能问答</text>
  <text x="640" y="148" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">自然语言提问 · 流式输出 · 答案可溯源</text>
  <!-- Top-right: 知识管理 -->
  <line x1="700" y1="330" x2="950" y2="200" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="920" y="140" width="300" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="1070" y="165" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">知识管理</text>
  <text x="1070" y="188" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">全生命周期 · 扫描件OCR · 表格保留</text>
  <!-- Right: 多源接入 -->
  <line x1="700" y1="400" x2="980" y2="400" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="990" y="370" width="250" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="1115" y="395" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">多源接入</text>
  <text x="1115" y="418" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">JDBC/REST/S3 · ETL</text>
  <!-- Bottom-right: 权限管控 -->
  <line x1="700" y1="440" x2="950" y2="540" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="900" y="530" width="320" height="60" rx="4" fill="#151B28" stroke="#7C4DFF" stroke-width="1"/>
  <text x="1060" y="555" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#7C4DFF">权限管控</text>
  <text x="1060" y="578" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">ABAC五维 · 全链路审计日志</text>
  <!-- Bottom: 统计仪表 -->
  <line x1="640" y1="460" x2="640" y2="560" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="460" y="560" width="360" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="640" y="585" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">统计仪表</text>
  <text x="640" y="608" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">问答趋势 · 满意度 · 热点Top10</text>
  <!-- Bottom-left: 知识目录 -->
  <line x1="580" y1="440" x2="330" y2="540" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="60" y="530" width="300" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="210" y="555" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">知识目录</text>
  <text x="210" y="578" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">域→源→实体 · 树形浏览</text>
  <!-- Left: 质量管控 -->
  <line x1="580" y1="400" x2="340" y2="400" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="370" width="280" height="60" rx="4" fill="#151B28" stroke="#1A73E8" stroke-width="1"/>
  <text x="180" y="395" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1A73E8">质量管控</text>
  <text x="180" y="418" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">多维校验 · 异常阻断 · 质量报告</text>
  <!-- Top-left: 反馈闭环 -->
  <line x1="580" y1="330" x2="330" y2="200" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="60" y="140" width="280" height="60" rx="4" fill="#151B28" stroke="#00C853" stroke-width="1"/>
  <text x="200" y="165" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#00C853">反馈闭环</text>
  <text x="200" y="188" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#9CA3AF">👍👎评价 · 质量持续优化 · Prompt迭代</text>
  <!-- Node dots on connectors -->
  <g fill="#00C853" fill-opacity="0.6">
    <circle cx="640" cy="230" r="3"/><circle cx="830" cy="260" r="3"/><circle cx="880" cy="380" r="3"/>
    <circle cx="830" cy="500" r="3"/><circle cx="640" cy="520" r="3"/><circle cx="450" cy="500" r="3"/>
    <circle cx="400" cy="380" r="3"/><circle cx="450" cy="260" r="3"/>
  </g>
  <text x="1200" y="695" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280">14</text>
</svg>
