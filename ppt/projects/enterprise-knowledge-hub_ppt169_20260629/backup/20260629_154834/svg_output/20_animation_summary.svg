<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><line x1="0" y1="60" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/><line x1="60" y1="0" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/></pattern></defs>
  <rect width="1280" height="720" fill="#0D1117"/><rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="60" y="35" width="4" height="48" rx="2" fill="#1A73E8"/>
  <text x="78" y="60" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#E8ECF0">动效设计方案汇总</text>
  <text x="78" y="88" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">十种动效类型 · 覆盖全21页 · 每页2-4秒</text>
  <!-- Table -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="1160" height="44" rx="4" fill="#1A73E8" fill-opacity="0.1"/>
    <text x="30" y="28" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#9CA3AF">动效类型</text>
    <text x="200" y="28" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#9CA3AF">应用页面</text>
    <text x="420" y="28" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#9CA3AF">效果描述</text>
    <text x="780" y="28" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#9CA3AF">设计意图</text>
    <g font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13">
      <line x1="10" y1="48" x2="1150" y2="48" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="70" fill="#E8ECF0">背景粒子流动</text><text x="200" y="70" fill="#6B7280">Slide 1 封面</text><text x="420" y="70" fill="#9CA3AF">深色渐变+粒子网络缓慢漂移</text><text x="780" y="70" fill="#6B7280">科技感氛围营造</text>
      <line x1="10" y1="82" x2="1150" y2="82" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="104" fill="#E8ECF0">时间轴点亮</text><text x="200" y="104" fill="#6B7280">Slide 2 政策演进</text><text x="420" y="104" fill="#9CA3AF">4阶段依次高亮+年份弹跳</text><text x="780" y="104" fill="#6B7280">强化"十年跃迁"叙事节奏</text>
      <line x1="10" y1="116" x2="1150" y2="116" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="138" fill="#E8ECF0">数字翻滚</text><text x="200" y="138" fill="#6B7280">Slide 7 成本对比</text><text x="420" y="138" fill="#9CA3AF">63.6→0.27 翻滚计数器效果</text><text x="780" y="138" fill="#6B7280">让降本数字更有冲击力</text>
      <line x1="10" y1="150" x2="1150" y2="150" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="172" fill="#E8ECF0">分层构建</text><text x="200" y="172" fill="#6B7280">Slide 9 技术架构</text><text x="420" y="172" fill="#9CA3AF">架构层从下往上逐层点亮</text><text x="780" y="172" fill="#6B7280">展示系统层次感</text>
      <line x1="10" y1="184" x2="1150" y2="184" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="206" fill="#E8ECF0">数据流粒子</text><text x="200" y="206" fill="#6B7280">Slide 12/13</text><text x="420" y="206" fill="#9CA3AF">节点间粒子沿连线流动</text><text x="780" y="206" fill="#6B7280">让数据流"看得见"</text>
      <line x1="10" y1="218" x2="1150" y2="218" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="240" fill="#E8ECF0">卡片翻转</text><text x="200" y="240" fill="#6B7280">Slide 11 六宫格</text><text x="420" y="240" fill="#9CA3AF">6张卡片依次3D翻转</text><text x="780" y="240" fill="#6B7280">节奏感，每个翻转是惊喜</text>
      <line x1="10" y1="252" x2="1150" y2="252" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="274" fill="#E8ECF0">打字机效果</text><text x="200" y="274" fill="#6B7280">Slide 1/15</text><text x="420" y="274" fill="#9CA3AF">标题/答案逐字出现</text><text x="780" y="274" fill="#6B7280">模仿AI输出，增强代入感</text>
      <line x1="10" y1="286" x2="1150" y2="286" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="308" fill="#E8ECF0">状态脉冲</text><text x="200" y="308" fill="#6B7280">Slide 13/17</text><text x="420" y="308" fill="#9CA3AF">放行绿脉冲/阻断红闪烁</text><text x="780" y="308" fill="#6B7280">直观传达质量/权限决策</text>
      <line x1="10" y1="320" x2="1150" y2="320" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="342" fill="#E8ECF0">进度条填充</text><text x="200" y="342" fill="#6B7280">Slide 8 ROI</text><text x="420" y="342" fill="#9CA3AF">回本时间线从左到右填充</text><text x="780" y="342" fill="#6B7280">让回收期"可视化"</text>
      <line x1="10" y1="354" x2="1150" y2="354" stroke="#2A3040" stroke-width="0.5"/>
      <text x="30" y="376" fill="#E8ECF0">勾选动画</text><text x="200" y="376" fill="#6B7280">Slide 19 路线图</text><text x="420" y="376" fill="#9CA3AF">每阶段功能逐条check入场</text><text x="780" y="376" fill="#6B7280">展示完成感和交付信心</text>
    </g>
  </g>
  <!-- Recommendations -->
  <rect x="60" y="510" width="1160" height="120" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
  <text x="90" y="540" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#E8ECF0">设计建议</text>
  <g font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15">
    <text x="90" y="570" fill="#00C853">✓</text><text x="115" y="570" fill="#9CA3AF">整体使用 Morph 平滑过渡，页与页之间元素自然衔接</text>
    <text x="90" y="595" fill="#00C853">✓</text><text x="115" y="595" fill="#9CA3AF">关键数据页用深色背景突出内容，文字页用浅色面板保证可读性</text>
    <text x="90" y="620" fill="#00C853">✓</text><text x="115" y="620" fill="#9CA3AF">动效总时长每页控制在 2-4 秒，避免拖沓</text>
  </g>
  <text x="640" y="695" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280">20</text>
</svg>
