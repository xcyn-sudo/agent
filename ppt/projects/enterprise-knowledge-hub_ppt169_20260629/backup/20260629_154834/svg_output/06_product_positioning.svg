<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><line x1="0" y1="60" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/><line x1="60" y1="0" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/></pattern></defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <!-- Header -->
  <rect x="60" y="40" width="4" height="56" rx="2" fill="#1A73E8"/>
  <text x="78" y="68" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#E8ECF0">产品定位：企业知识中枢</text>
  <text x="78" y="98" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">左：一句话定位 · 右：改善前后核心指标对比</text>
  <!-- Left: Positioning -->
  <rect x="60" y="140" width="540" height="520" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
  <text x="330" y="260" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#E8ECF0">让每个员工都能</text>
  <text x="330" y="310" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#E8ECF0">像问资深同事一样</text>
  <text x="330" y="360" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#00C853">秒级获取企业知识</text>
  <circle cx="330" cy="420" r="24" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="330" y="427" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1A73E8">AI</text>
  <!-- Right: Comparison table -->
  <g transform="translate(640, 140)">
    <rect width="580" height="520" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
    <!-- Table header -->
    <rect x="0" y="0" width="580" height="52" rx="4" fill="#1A73E8" fill-opacity="0.1"/>
    <text x="140" y="33" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#9CA3AF">指标</text>
    <text x="310" y="33" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#FF1744">改善前</text>
    <text x="480" y="33" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#00C853">改善后</text>
    <!-- Row 1 -->
    <line x1="20" y1="74" x2="560" y2="74" stroke="#2A3040" stroke-width="0.5"/>
    <text x="30" y="100" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8ECF0">单次查找耗时</text>
    <text x="260" y="100" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#FF1744">23 分钟</text>
    <line x1="280" y1="110" x2="420" y2="110" stroke="#2A3040" stroke-width="0.5"/>
    <text x="440" y="100" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#00C853">10 秒</text>
    <text x="520" y="100" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00C853">99.3%↓</text>
    <!-- Row 2 -->
    <line x1="20" y1="140" x2="560" y2="140" stroke="#2A3040" stroke-width="0.5"/>
    <text x="30" y="166" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8ECF0">跨部门信息获取</text>
    <text x="260" y="166" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#FF1744">4 小时</text>
    <line x1="280" y1="176" x2="420" y2="176" stroke="#2A3040" stroke-width="0.5"/>
    <text x="440" y="166" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#00C853">30 秒</text>
    <text x="520" y="166" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00C853">99.8%↓</text>
    <!-- Row 3 -->
    <line x1="20" y1="206" x2="560" y2="206" stroke="#2A3040" stroke-width="0.5"/>
    <text x="30" y="232" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8ECF0">重复问题人工回答</text>
    <text x="260" y="232" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#FF1744">100%</text>
    <line x1="280" y1="242" x2="420" y2="242" stroke="#2A3040" stroke-width="0.5"/>
    <text x="440" y="232" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#00C853">20%</text>
    <text x="520" y="232" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00C853">80%↓</text>
    <!-- Row 4 -->
    <line x1="20" y1="272" x2="560" y2="272" stroke="#2A3040" stroke-width="0.5"/>
    <text x="30" y="298" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8ECF0">新人上手周期</text>
    <text x="260" y="298" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#FF1744">2 天</text>
    <line x1="280" y1="308" x2="420" y2="308" stroke="#2A3040" stroke-width="0.5"/>
    <text x="440" y="298" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#00C853">0.5 天</text>
    <text x="520" y="298" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00C853">75%↓</text>
  </g>
  <!-- Bottom quote -->
  <text x="640" y="695" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" fill="#6B7280">不是替代人，是让每个人不再把时间浪费在"找东西"上</text>
</svg>
