<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><line x1="0" y1="60" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/><line x1="60" y1="0" x2="60" y2="60" stroke="#1E2640" stroke-width="0.4"/></pattern></defs>
  <rect width="1280" height="720" fill="#0D1117"/><rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="60" y="40" width="4" height="56" rx="2" fill="#1A73E8"/>
  <text x="78" y="68" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" fill="#E8ECF0">典型用户场景</text>
  <text x="78" y="98" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">覆盖四类用户角色 · 三个典型场景深度展示</text>
  <!-- Three scenario cards -->
  <!-- Card 1: 新员工 -->
  <rect x="60" y="150" width="370" height="460" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
  <rect x="60" y="150" width="370" height="44" rx="4" fill="#1A73E8" fill-opacity="0.12"/>
  <text x="245" y="178" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#1A73E8">新员工入职</text>
  <text x="100" y="230" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9CA3AF">小王，研发部新人</text>
  <rect x="100" y="258" width="290" height="70" rx="4" fill="#1A73E8" fill-opacity="0.06" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="120" y="282" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">输入："新人开发环境搭建</text>
  <text x="120" y="305" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">的完整步骤"</text>
  <line x1="100" y1="355" x2="390" y2="355" stroke="#2A3040" stroke-width="0.5"/>
  <rect x="100" y="370" width="290" height="100" rx="4" fill="#00C853" fill-opacity="0.06" stroke="#00C853" stroke-width="0.5"/>
  <text x="120" y="395" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">结果：30分钟搞定环境</text>
  <text x="120" y="420" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">上手时间从 2天 → 半天</text>
  <text x="120" y="448" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">新员工融入效率提升 75%</text>
  <!-- Card 2: 跨部门 -->
  <rect x="455" y="150" width="370" height="460" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
  <rect x="455" y="150" width="370" height="44" rx="4" fill="#7C4DFF" fill-opacity="0.12"/>
  <text x="640" y="178" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#7C4DFF">跨部门协作</text>
  <text x="495" y="230" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9CA3AF">张经理，研发→销售</text>
  <rect x="495" y="258" width="290" height="70" rx="4" fill="#7C4DFF" fill-opacity="0.06" stroke="#7C4DFF" stroke-width="0.5"/>
  <text x="515" y="282" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">输入："销售部客户签约</text>
  <text x="515" y="305" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">的最新流程"</text>
  <line x1="495" y1="355" x2="785" y2="355" stroke="#2A3040" stroke-width="0.5"/>
  <rect x="495" y="370" width="290" height="100" rx="4" fill="#00C853" fill-opacity="0.06" stroke="#00C853" stroke-width="0.5"/>
  <text x="515" y="395" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">结果：30秒了解流程变化</text>
  <text x="515" y="420" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">不需打扰销售同事</text>
  <text x="515" y="448" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">跨部门沟通成本降低 99.8%</text>
  <!-- Card 3: 合规审计 -->
  <rect x="850" y="150" width="370" height="460" rx="4" fill="#151B28" stroke="#2A3040" stroke-width="1"/>
  <rect x="850" y="150" width="370" height="44" rx="4" fill="#00C853" fill-opacity="0.12"/>
  <text x="1035" y="178" text-anchor="middle" font-family="SimHei, Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#00C853">合规审计</text>
  <text x="890" y="230" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9CA3AF">李总，CFO</text>
  <rect x="890" y="258" width="290" height="70" rx="4" fill="#00C853" fill-opacity="0.06" stroke="#00C853" stroke-width="0.5"/>
  <text x="910" y="282" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">输入："2024Q1差旅报销</text>
  <text x="910" y="305" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#E8ECF0">调整政策"</text>
  <line x1="890" y1="355" x2="1180" y2="355" stroke="#2A3040" stroke-width="0.5"/>
  <rect x="890" y="370" width="290" height="100" rx="4" fill="#00C853" fill-opacity="0.06" stroke="#00C853" stroke-width="0.5"/>
  <text x="910" y="395" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">结果：秒级定位签发文件</text>
  <text x="910" y="420" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" fill="#00C853">审计有据可查</text>
  <text x="910" y="448" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#6B7280">合规追溯响应时间 → 秒级</text>
  <!-- Bottom summary -->
  <text x="640" y="660" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#9CA3AF">覆盖四类用户角色 — 一线员工 ｜ 中层管理 ｜ 高层管理 ｜ IT管理员</text>
  <text x="1200" y="695" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280">《软件需求规格说明书 v2.0》第6章</text>
</svg>
