    <text x="520" y="166" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00C853">99.8%↓</text>
    
    <line x1="20" y1="206" x2="560" y2="206" stroke="#2A3040" stroke-width="0.5" />
