  <text x="78" y="98" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#6B7280" letter-spacing="2">左：一句话定位 · 右：改善前后核心指标对比</text>
  
  <path fill="#151B28" stroke="#2A3040" stroke-width="1" d="M64,140 H596 A4,4 0 0 1 600,144 V656 A4,4 0 0 1 596,660 H64 A4,4 0 0 1 60,656 V144 A4,4 0 0 1 64,140 Z" />
